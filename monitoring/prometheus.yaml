apiVersion: v1
kind: Namespace
metadata:
  name: agrolink-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: agrolink-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
            labels:
              service: 'prometheus'

      # Scrape AgroLink Backend
      - job_name: 'agrolink-backend'
        static_configs:
          - targets: ['backend.agrolink-prod.svc.cluster.local:7000']
            labels:
              service: 'agrolink-backend'
              env: 'production'

      # Scrape AgroLink Frontend (nginx metrics)
      - job_name: 'agrolink-frontend'
        static_configs:
          - targets: ['frontend.agrolink-prod.svc.cluster.local:80']
            labels:
              service: 'agrolink-frontend'
              env: 'production'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: agrolink-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus/"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/
        - name: storage-volume
          mountPath: /prometheus/
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "100m"
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
      - name: storage-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: agrolink-monitoring
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: ClusterIP
