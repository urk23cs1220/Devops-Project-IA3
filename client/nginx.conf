server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy requests starting with /api to backend (if not using VITE_API_URL absolute paths)
    # location /api/ {
    #     proxy_pass http://backend:7000;
    # }
}
