name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v4
      with:
        context: ./server
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrolink-backend:latest

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./client
        push: true
        build-args: |
          VITE_API_URL=http://localhost:30000
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrolink-frontend:latest

    - name: Set up Minikube/Kubectl
      uses: medyagh/setup-minikube@master

    - name: Inject image placeholders in manifests
      run: |
        sed -i "s|DOCKER_HUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" k8s/backend.yaml
        sed -i "s|DOCKER_HUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" k8s/frontend.yaml

    - name: Deploy to Kubernetes
      run: |
        # Ensure namespace exists
        kubectl create namespace agrolink-prod --dry-run=client -o yaml | kubectl apply -f -
        
        # Create or update secrets
        kubectl create secret generic agrolink-secrets \
          --namespace agrolink-prod \
          --from-literal=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
          --from-literal=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }} \
          --from-literal=JWT_SECRET=${{ secrets.JWT_SECRET }} \
          --dry-run=client -o yaml | kubectl apply -f -

        # Apply manifests
        kubectl apply -f k8s/backend.yaml
        kubectl apply -f k8s/frontend.yaml
        
    - name: Verify Deployment
      run: |
        kubectl get pods -n agrolink-prod
        kubectl get svc -n agrolink-prod
