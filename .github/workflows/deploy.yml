name: AgroLink DevOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd server && npm install
          cd ../client && npm install
      - name: Run Lint
        run: |
          cd server && npm run lint || true
          cd ../client && npm run lint || true

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Backend Deps
        run: cd server && npm install
      - name: Run Backend Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: test
        run: cd server && npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        continue-on-error: true
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/agrolink-backend:latest
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        continue-on-error: true
        with:
          context: ./client
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/agrolink-frontend:latest

  security-scan:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Run Trivy vulnerability scanner on Backend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: '${{ secrets.DOCKER_HUB_USERNAME }}/agrolink-backend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: '${{ secrets.DOCKER_HUB_USERNAME }}/agrolink-frontend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" > ~/.kube/config
      - name: Deploy to K8s Staging
        continue-on-error: true
        run: |
          kubectl apply -f k8s/configmap.yaml --validate=false || true
          kubectl apply -f k8s/backend.yaml --validate=false || true
          kubectl apply -f k8s/frontend.yaml --validate=false || true
          kubectl apply -f k8s/hpa.yaml --validate=false || true

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" > ~/.kube/config
      - name: Deploy to K8s Production
        continue-on-error: true
        run: |
          kubectl apply -f k8s/configmap.yaml --validate=false || true
          kubectl apply -f k8s/backend.yaml --validate=false || true
          kubectl apply -f k8s/frontend.yaml --validate=false || true
          kubectl apply -f k8s/hpa.yaml --validate=false || true
