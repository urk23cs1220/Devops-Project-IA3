---
- name: Automate AgroLink Kubernetes Deployment
  hosts: localhost
  connection: local
  tasks:
    - name: Ensure Namespace exists
      command: kubectl create namespace agrolink-prod --dry-run=client -o yaml | kubectl apply -f -

    - name: Apply Kubernetes Configurations
      command: "kubectl apply -f ../k8s/{{ item }}"
      loop:
        - configmap.yaml
        - backend.yaml
        - frontend.yaml
        - hpa.yaml
      register: apply_results

    - name: Wait for Backend to be ready
      command: kubectl rollout status deployment/backend -n agrolink-prod
      
    - name: Wait for Frontend to be ready
      command: kubectl rollout status deployment/frontend -n agrolink-prod

    - name: Verify Health Check Service
      uri:
        url: "http://localhost:30008/api/test"
        status_code: 200
      register: health_check
      ignore_errors: yes
      description: "Checks if the backend is reachable via NodePort 30008"

    - name: Get final status of pods
      command: kubectl get pods -n agrolink-prod
      register: pods_result

    - name: Show Final Pod Status
      debug:
        var: pods_result.stdout
