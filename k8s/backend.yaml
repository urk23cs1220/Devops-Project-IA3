apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: agrolink-prod
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Using a variable for Docker Hub username - replace with yours or use CI/CD substitution
        image: deepak56006/agrolink-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 7000
        env:
        - name: PORT
          value: "7000"
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: agrolink-secrets
              key: SUPABASE_URL
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: agrolink-secrets
              key: SUPABASE_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: agrolink-secrets
              key: JWT_SECRET
        - name: OPENWEATHER_API_KEY
          value: "741e291841cd4c6a9dc120512252610"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: agrolink-prod
spec:
  selector:
    app: backend
  ports:
  - port: 7000
    targetPort: 7000
  type: NodePort
