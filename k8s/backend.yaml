apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: agrolink-backend:latest
        imagePullPolicy: Never # Use local image for Minikube
        ports:
        - containerPort: 7000
        env:
        - name: PORT
          value: "7000"
        - name: MONGODB_URI
          # Connect to the MongoDB service created earlier
          value: "mongodb://mongodb:27017/agrolink"
        # Secret values could be managed via K8s Secrets, configuring directly for assignment simplicity
        - name: JWT_SECRET
          value: "a788b287d778888b29642264814fdccf7061040b82c091a4dae29b2127a749ac"
        - name: OPENWEATHER_API_KEY
          value: "741e291841cd4c6a9dc120512252610"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 7000
    targetPort: 7000
  # Ensure backend is accessible from within the cluster for frontend service optionally,
  # or if frontend runs client-side it needs an exposed port
  type: NodePort
